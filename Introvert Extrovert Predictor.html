<script>

async function predictPersonality(){

    const data = {
        Time_spent_Alone: Number(document.getElementById("alone").value),
        Stage_fear: document.getElementById("fear").value,
        Social_event_attendance: Number(document.getElementById("attendance").value),
        Going_outside: Number(document.getElementById("outside").value),
        Drained_after_socializing: document.getElementById("drained").value,
        Friends_circle_size: Number(document.getElementById("friends").value),
        Post_frequency: Number(document.getElementById("post").value)
    };

    const response = await fetch("/predict",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    const result = await response.json();

    document.getElementById("result").innerHTML =
        "Prediction: " + result.prediction;
}

</script>
